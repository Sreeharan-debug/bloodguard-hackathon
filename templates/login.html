<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BloodGuard — Staff Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #1A1A2E;
    }
    .login-card {
      background: #fff;
      border: 1px solid #E8ECF0;
      border-radius: 12px;
      padding: 48px 44px;
      width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .login-brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 32px;
    }
    .login-brand-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: #B91C1C;
      display: grid; place-items: center; font-size: 18px;
    }
    .login-brand-name { font-size: 18px; font-weight: 700; color: #1A1A2E; }
    .login-brand-sub  { font-size: 12px; color: #6B7280; margin-top: 1px; }

    h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: #6B7280; margin-bottom: 28px; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: #374151; margin-bottom: 6px; letter-spacing: 0.2px;
    }
    .field input {
      width: 100%; padding: 10px 12px;
      border: 1px solid #D1D5DB; border-radius: 8px;
      font-size: 14px; font-family: 'Inter', sans-serif;
      color: #1A1A2E; background: #fff;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: #1D4ED8;
      box-shadow: 0 0 0 3px rgba(29,78,216,0.1);
    }
    .field input::placeholder { color: #9CA3AF; }

    .error-box {
      background: #FEF2F2; border: 1px solid #FECACA;
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; color: #B91C1C; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }

    .btn-login {
      width: 100%; padding: 11px;
      background: #1D4ED8; border: none; border-radius: 8px;
      color: #fff; font-size: 14px; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    .btn-login:hover { background: #1E40AF; }

    .login-footer {
      text-align: center; margin-top: 24px;
      font-size: 11px; color: #9CA3AF;
    }
    .security-note {
      display: flex; align-items: center; gap: 6px;
      background: #F9FAFB; border: 1px solid #E5E7EB;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 20px;
      font-size: 12px; color: #6B7280;
    }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-brand">
    <div class="login-brand-icon">🩸</div>
    <div>
      <div class="login-brand-name">BloodGuard</div>
      <div class="login-brand-sub">Storage Monitoring System</div>
    </div>
  </div>

  <h2>Sign in</h2>
  <p class="login-sub">Authorised staff only — all access is logged.</p>

  <div class="security-note">
    🔒 Secure staff access portal
  </div>

  {% if error %}
  <div class="error-box">⚠ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text"
             placeholder="Enter your staff username" required autofocus/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             placeholder="Enter your password" required/>
    </div>
    <button type="submit" class="btn-login">Sign in →</button>
  </form>

  <div class="login-footer">BloodGuard v2.0 · Restricted System</div>
</div>
</body>
</html>
